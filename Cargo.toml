[package]
name = "rbxoc"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "CLI for the Roblox Open Cloud API, designed for coding agents"
license = "MIT"
repository = "https://github.com/eiei114/rbxoc"
readme = "README.md"
keywords = ["roblox", "open-cloud", "cli", "assets", "game-development"]
categories = ["command-line-utilities", "development-tools"]
# Internal task tracking and local scripts are not part of the crate.
exclude = [".ralph/", ".pi/"]

[[bin]]
name = "rbxoc"
path = "src/main.rs"

[dependencies]
# Argument parsing. derive declares the subcommands.
clap = { version = "4.5", features = ["derive", "env"] }
# HTTP client. Needs multipart and timeouts.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
# Encode caller-supplied URL path segments without interpreting delimiters.
percent-encoding = "2"
# Async runtime. Some commands issue concurrent calls, so tokio is direct.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
# JSON. Required for the agent-facing output.
serde = { version = "1", features = ["derive"] }
# preserve_order keeps envelope key order stable for agents reading the surface.
serde_json = { version = "1", features = ["preserve_order"] }
# Timestamp formatting for log output.
time = { version = "0.3", features = ["formatting", "macros"] }
# Lockfile parsing for the asset ID registry.
toml = "0.9"
# Deterministic file walking for the asset globs.
glob = "0.3"
# Parses .rbxm / .rbxmx to tell Animation from Model. Both asset types share
# the extension and content type, so the file must be read.
rbx_binary = "3.0.1"
rbx_xml = "3.0.1"
# Errors. anyhow adds context; the exit code is chosen by the CLI itself.
anyhow = "1"
thiserror = "2"
# Pre-upload content hash (Asphalt lock import and future scoped locks).
blake3 = "1"
sha2 = "0.10"
# SVG → PNG before upload (Asphalt parity for image assets).
resvg = "0.45.1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }

[dev-dependencies]
# Verify request building without hitting the real API.
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
