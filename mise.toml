[tools]
# Rust for build/test. mise supplies it so the host does not need rustup.
rust = "1.99.0"

# Optional dev-only duplicate detection (https://github.com/mizchi/similarity).
# Not part of CI; run `mise run similarity` after large refactors in src/.
"cargo:similarity-rs" = "0.5.0"

# No Roblox-side tools here.
#
# rbxoc talks to the Open Cloud HTTP API and reads .rbxm/.rbxmx through the
# rbx_binary / rbx_xml crates. It does not shell out to Rojo, pesde, or any
# other Roblox tooling, so pinning them would only invite a stale PATH copy
# to shadow the pin. Add one here only when a task in this file needs it.

# Do not add automatic updates here.
# self_update.auto and tool_update.global_auto are global-only settings, and
# mise rejects them in this file. Update tools with `mise run update-tools`.

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.check]
description = "Run fmt, clippy, and tests"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.install-local]
description = "Build and install into ~/.local/bin"
run = "cargo install --path . --locked"

[tasks.update-tools]
description = "Update mise.toml tools to the latest versions (--apply to write)"
run = "node scripts/update-tools.mjs"

[tasks.demo]
description = "Try the catalog output that needs no credentials"
run = [
  "cargo run --quiet -- api list --implemented",
  "cargo run --quiet -- api mutating",
]

[tasks.verify]
description = "Full monitor-rerunnable verification"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  "cargo build --release",
  "node scripts/check-coverage.mjs",
  "node --test scripts/live-sweep.test.mjs",
]

[tasks.similarity]
description = "Dev-only: find similar Rust functions under src/ (similarity-rs)"
run = "similarity-rs src --skip-test --threshold 0.85 --min-lines 8"
