[tools]
# CLI 本体のビルドに使う。mise が Rust を供給するので、ホスト側の
# rustup 有無に依存しない。
rust = "1.99.0"
# Roblox 側のツール。place 生成と Luau パッケージ。
"github:rojo-rbx/rojo" = "7.7.1"
"github:pesde-pkg/pesde" = "0.7.4"

# 自動更新はここに書かない。
# self_update.auto と tool_update.global_auto は global-only の設定で、
# このファイルでは mise が拒否する。更新は `mise run update-tools` で行う。

[tasks.build]
description = "release バイナリをビルドする"
run = "cargo build --release"

[tasks.check]
description = "fmt / clippy / test をまとめて通す"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.install-local]
description = "ビルドして ~/.local/bin へ入れる"
run = "cargo install --path . --locked"

[tasks.update-tools]
description = "mise.toml のツールを最新版へ更新する（--apply で適用）"
run = "node scripts/update-tools.mjs"

[tasks.demo]
description = "認証不要のカタログ出力を試す"
run = [
  "cargo run --quiet -- api list --implemented",
  "cargo run --quiet -- api mutating",
]
