name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      # Verify the CLI contract in CI too. Only credential-free paths here.
      - name: Catalog contract
        run: |
          set -euo pipefail
          OUT=$(./target/release/rbxoc api list)
          echo "$OUT" | grep -q '"ok": true'
          echo "$OUT" | grep -q '"command": "api list"'

      - name: Auth missing exit code
        run: |
          set +e
          env -u RBXOC_API_KEY -u RBXOC_OAUTH_TOKEN \
            ./target/release/rbxoc place get --universe-id 1 --place-id 2 >/dev/null
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Unknown endpoint exit code
        run: |
          set +e
          ./target/release/rbxoc api show no.such.endpoint >/dev/null
          code=$?
          set -e
          test "$code" -eq 64 || { echo "expected exit 64, got $code"; exit 1; }
